<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.classList.add('is-loading');</script>
    <title>Other Work | Mick Willemsen</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/logo.svg">
    <script src="js/landing-gallery.js" defer></script>
    <script src="js/loader.js" defer></script>
</head>
<body class="case-gallery-page">
    <div class="site-loader" role="status" aria-live="polite" aria-label="Loading website">
        <div class="site-loader__inner">
            <div class="site-loader__bar">
                <div class="site-loader__bar-fill"></div>
            </div>
            <p class="site-loader__progress">Loading 0%</p>
        </div>
    </div>

    <section class="landing">
        <div class="landing-gallery">
            <div class="landing-gallery__header">
                <div class="landing-gallery__title-card">
                    <h1>Mick Willemsen</h1>
                    <p class="landing-gallery__subtitle">Emerging Artists 2026</p>
                </div>
            </div>
            <div class="landing-gallery__track">
                <div class="landing-gallery__item" data-caption="Other Work placeholder image 01">
                    <img src="assets/images/TheWindowStill.png" data-static-src="assets/images/TheWindowStill.png" data-animated-src="assets/images/ezgif-windowgif.gif" alt="Other Work window animation">
                    <div class="landing-gallery__card">
                        <p class="landing-gallery__card-title">The Window</p>
                        <p class="landing-gallery__card-subtitle">Immersive VR experience</p>
                    </div>
                </div>
                <div class="landing-gallery__item landing-gallery__item--contain" data-caption="Other Work placeholder image 02">
                    <img src="assets/images/OverrideStill.png" data-static-src="assets/images/OverrideStill.png" data-animated-src="assets/images/ezgif-override.gif" alt="Other Work override animation">
                    <div class="landing-gallery__card">
                        <p class="landing-gallery__card-title">Override</p>
                        <p class="landing-gallery__card-subtitle">Audio reactive visual</p>
                    </div>
                </div>
                <div class="landing-gallery__item" data-caption="Other Work placeholder image 03">
                    <img src="assets/images/WavesStill.png" data-static-src="assets/images/WavesStill.png" data-animated-src="assets/images/ezgif-waves.gif" alt="Other Work waves animation">
                    <div class="landing-gallery__card">
                        <p class="landing-gallery__card-title">Waves</p>
                        <p class="landing-gallery__card-subtitle">Analog visual experiment</p>
                    </div>
                </div>
                <div class="landing-gallery__item" data-caption="Other Work placeholder image 04">
                    <img src="assets/images/Lightbloom.jpg" data-static-src="assets/images/Lightbloom.jpg" data-animated-src="assets/images/ezgif-lightbloom.gif" alt="Other Work lightbloom animation">
                    <div class="landing-gallery__card">
                        <p class="landing-gallery__card-title">Lightbloom</p>
                        <p class="landing-gallery__card-subtitle">Geometric visual</p>
                    </div>
                </div>
                <div class="landing-gallery__item" data-caption="Other Work placeholder image 05">
                    <img src="assets/images/cascade.png" data-static-src="assets/images/cascade.png" data-animated-src="assets/images/ezgif-cascade.gif" alt="Other Work cascade animation">
                    <div class="landing-gallery__card">
                        <p class="landing-gallery__card-title">Cascade</p>
                        <p class="landing-gallery__card-subtitle">Generative visual</p>
                    </div>
                </div>
                <div class="landing-gallery__mobile-end-spacer" aria-hidden="true"></div>
            </div>
            <div class="landing-gallery__line-wrap">
                <div class="landing-gallery__line" aria-hidden="true">
                    <div class="landing-gallery__indicator"></div>
                </div>
                <div class="landing-gallery__meta">
                    <div class="landing-gallery__meta-primary">
                        <p class="landing-gallery__prompt">Hover or scroll to explore</p>
                    </div>
                    <p class="landing-gallery__active-label" aria-live="polite"></p>
                    <div class="landing-gallery__contact">
                        <a href="index.html">Back to main page</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="grain"></div>
</body>
</html>
